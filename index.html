<!DOCTYPE html>  
<html lang="zh-TW">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>多帳本理財與旅行記帳簿</title>  
    <link rel="icon" type="image/png" sizes="192x192" href="ICON.png">  
    <link rel="apple-touch-icon" sizes="180x180" href="ICON.png">  
      
    <script src="https://cdn.tailwindcss.com"></script>  
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">  
    <style>  
        body {  
            font-family: 'Noto Sans TC', sans-serif;  
            background-color: #fcfaf7;  
            color: #5d5245;  
        }  
        .milktea-gradient {  
            background: linear-gradient(135deg, #dccabd 0%, #b8a390 100%);  
        }  
        .milktea-gradient-green {  
            background: linear-gradient(135deg, #c5d3c1 0%, #a4b69c 100%);  
        }  
        .milktea-gradient-brown {  
            background: linear-gradient(135deg, #e5ddd3 0%, #c8b6a6 100%);  
        }  
        .input-style {  
            background-color: #f3ede6;  
            border: 1px solid #e5ddd3;  
            border-radius: 12px;  
            outline: none;  
            transition: all 0.2s;  
        }  
        .input-style:focus {  
            background-color: #fff;  
            border-color: #b8a390;  
            box-shadow: 0 0 0 3px rgba(184, 163, 144, 0.1);  
        }  
        .modal-bg {  
            background-color: rgba(93, 82, 69, 0.4);  
        }  
        .tab-btn {  
            transition: all 0.2s;  
        }  
        .stat-card {  
            background: #fdfcfb;  
            border-radius: 16px;  
            padding: 16px;  
            border: 1px solid #f1ece7;  
        }  
        .pie-chart {  
            width: 120px;  
            height: 120px;  
            border-radius: 50%;  
            flex-shrink: 0;  
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);  
        }  
        .payment-tag {  
            font-size: 9px;  
            padding: 2px 6px;  
            border-radius: 6px;  
            background: #eeeae4;  
            color: #8c7e6e;  
        }  
        .hide-scrollbar::-webkit-scrollbar {  
            display: none;  
        }  
        .hide-scrollbar {  
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }  
    </style>  
</head>  
<body class="p-4 md:p-8">  
    <div id="main-app" class="max-w-6xl mx-auto">  
        <!-- 頂部帳本切換列 -->  
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-100 mb-6 flex flex-wrap justify-between items-center gap-4">  
            <div class="flex items-center gap-2 overflow-x-auto max-w-full pb-1" id="ledger-tabs-container">  
                <!-- 動態載入帳本按鈕 -->  
            </div>  
            <button onclick="toggleModal('ledger-modal')" class="text-xs milktea-gradient text-white px-4 py-2 rounded-xl font-bold shadow-sm whitespace-nowrap">+ 新增帳本</button>  
        </div>  

        <div class="mb-6 flex justify-between items-center">  
            <div>  
                <h1 class="text-3xl font-black tracking-widest text-stone-700" id="current-ledger-title">理財記帳簿</h1>  
                <div id="sync-status" class="hidden"><span class="text-[10px] text-stone-300">雲端資料同步中...</span></div>  
            </div>  
            <button onclick="switchAppMode()" id="mode-switch-btn" class="px-4 py-2 bg-[#dccabd] text-white rounded-xl font-bold text-xs shadow-sm hover:brightness-105 transition">  
                切換至：✈️ 旅行帳本模式  
            </button>  
        </div>  

        <header class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">  
            <div class="lg:col-span-8 flex items-center"></div>  
            <div class="lg:col-span-4 flex flex-col gap-3 bg-white p-6 rounded-2xl shadow-sm border border-stone-100">  
                <div class="flex flex-col gap-1">  
                    <label class="text-[9px] text-stone-400 font-bold px-1 uppercase tracking-tight">雲端同步網址 (Script URL)</label>  
                    <div class="flex gap-2">  
                        <input type="text" id="script-url" placeholder="https://script.google.com/..." class="text-[10px] p-2.5 input-style flex-grow" onchange="saveData()">  
                        <button onclick="syncWithSheets(true)" id="sync-btn" class="text-[10px] milktea-gradient text-white px-4 py-2 rounded-xl font-bold whitespace-nowrap shadow-sm">同步</button>  
                    </div>  
                </div>  
            </div>  
        </header>  

        <!-- ================= 財經主帳本介面 ================= -->  
        <div id="finance-view" class="space-y-8">  
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">  
                <div class="lg:col-span-8">  
                    <div class="bg-white rounded-2xl p-6 mb-8 border border-stone-100 shadow-sm">  
                        <div class="flex justify-between items-center mb-4">  
                            <h3 class="text-xs font-bold text-stone-400 tracking-widest uppercase">帳戶資產管理 (總結)</h3>  
                            <div class="flex items-center gap-3">  
                                <div class="flex flex-col items-end">  
                                    <div class="flex items-center gap-1 text-[10px] text-stone-400">  
                                        <span>美元匯率:</span>  
                                        <input type="number" id="usd-rate" readonly class="w-14 bg-stone-100 rounded px-1 text-stone-700 font-bold">  
                                    </div>  
                                </div>  
                                <button onclick="toggleModal('account-modal')" class="text-[10px] bg-stone-100 text-stone-500 px-3 py-1 rounded-full">+ 管理帳戶</button>  
                            </div>  
                        </div>  
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="accounts-container"></div>  
                        <div class="mt-4 pt-4 border-t border-stone-50 flex justify-between items-center">  
                            <span class="text-xs text-stone-400 tracking-widest">總資產淨值 (TWD)</span>  
                            <span class="text-xl font-black text-stone-700" id="total-assets">$0</span>  
                        </div>  
                    </div>  

                    <div class="flex justify-between items-center mb-4">  
                        <h2 class="text-xl font-black text-stone-700 tracking-widest border-l-4 border-[#b8a390] pl-3">月度收支與預算</h2>  
                        <input type="hidden" id="view-month">  
                        <button onclick="openMonthPickerModal()" id="view-month-btn" class="p-2 px-4 input-style text-sm font-bold text-stone-600 shadow-sm flex items-center gap-2 hover:bg-white transition">  
                            <span id="view-month-display">載入中...</span>  
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#b8a390]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>  
                        </button>  
                    </div>  

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">  
                        <div class="bg-white rounded-2xl p-6 border border-stone-100 shadow-sm">  
                            <h3 class="text-xs font-bold text-stone-400 mb-4 tracking-widest uppercase flex justify-between items-center">  
                                <span>基本預算與分配</span>  
                                <span id="jar-total-warning" class="text-red-400 hidden text-[9px] font-bold bg-red-50 px-2 py-0.5 rounded">總和需為100%</span>  
                            </h3>  
                            <div class="grid grid-cols-2 gap-4 mb-4 pb-4 border-b border-stone-50">  
                                <div>  
                                    <label class="block text-[10px] text-stone-400 mb-1">實拿月薪 (TWD)</label>  
                                    <input type="number" id="salary" class="w-full p-2.5 input-style font-bold text-stone-700" onchange="updateGlobalSettings()">  
                                </div>  
                                <div>  
                                    <label class="block text-[10px] text-stone-400 mb-1">儲蓄目標 (固定 TWD)</label>  
                                    <input type="number" id="savings-goal" class="w-full p-2.5 input-style font-bold text-stone-700" onchange="updateGlobalSettings()">  
                                </div>  
                            </div>  
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">  
                                <div>  
                                    <label class="block text-[9px] text-stone-400 mb-1 text-center">必要 (%)</label>  
                                    <input type="number" id="jar-pct-nec" class="w-full p-2 input-style text-center font-bold text-stone-600 text-xs" onchange="updateGlobalSettings()">  
                                </div>  
                                <div>  
                                    <label class="block text-[9px] text-stone-400 mb-1 text-center">財富 (%)</label>  
                                    <input type="number" id="jar-pct-ffa" class="w-full p-2 input-style text-center font-bold text-stone-600 text-xs" onchange="updateGlobalSettings()">  
                                </div>  
                                <div>  
                                    <label class="block text-[9px] text-stone-400 mb-1 text-center">興趣 (%)</label>  
                                    <input type="number" id="jar-pct-int" class="w-full p-2 input-style text-center font-bold text-stone-600 text-xs" onchange="updateGlobalSettings()">  
                                </div>  
                                <div>  
                                    <label class="block text-[9px] text-stone-400 mb-1 text-center">享樂 (%)</label>  
                                    <input type="number" id="jar-pct-play" class="w-full p-2 input-style text-center font-bold text-stone-600 text-xs" onchange="updateGlobalSettings()">  
                                </div>  
                            </div>  
                        </div>  
                        <div class="bg-white rounded-2xl p-6 border border-stone-100 shadow-sm">  
                            <div class="flex justify-between items-center mb-4">  
                                <h3 class="text-xs font-bold text-stone-400 tracking-widest uppercase">固定支出設定</h3>  
                                <button onclick="toggleModal('fixed-expense-modal')" class="text-[10px] text-stone-400 hover:text-[#b8a390]">+ 新增</button>  
                            </div>  
                            <div id="fixed-expenses-list" class="space-y-2 max-h-32 overflow-y-auto pr-1"></div>  
                        </div>  
                    </div>  

                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-8" id="jars-container"></div>  

                    <div class="milktea-gradient text-white rounded-3xl p-10 shadow-lg text-center mb-8">  
                        <h2 class="text-sm font-medium opacity-80 mb-3 uppercase tracking-widest">本月剩餘可動用金額 (TWD)</h2>  
                        <div class="text-7xl font-black tracking-tighter" id="monthly-total">$0</div>  
                    </div>  
                </div>  

                <div class="lg:col-span-4">  
                    <div class="bg-white rounded-2xl p-6 border border-stone-100 shadow-sm h-full flex flex-col">  
                        <div class="flex mb-6 border-b border-stone-100 overflow-x-auto hide-scrollbar pb-1">  
                            <button onclick="switchTab('expense')" id="tab-expense" class="tab-btn min-w-[50px] flex-1 py-2 text-[11px] font-bold border-b-2 border-[#b8a390] whitespace-nowrap">支出</button>  
                            <button onclick="switchTab('income')" id="tab-income" class="tab-btn min-w-[50px] flex-1 py-2 text-[11px] font-bold text-stone-300 whitespace-nowrap">收入</button>  
                            <button onclick="switchTab('extra')" id="tab-extra" class="tab-btn min-w-[50px] flex-1 py-2 text-[11px] font-bold text-stone-300 whitespace-nowrap">多支出</button>  
                            <button onclick="switchTab('adjustment')" id="tab-adjustment" class="tab-btn min-w-[50px] flex-1 py-2 text-[11px] font-bold text-stone-300 whitespace-nowrap">調整</button>  
                            <button onclick="switchTab('stats')" id="tab-stats" class="tab-btn min-w-[50px] flex-1 py-2 text-[11px] font-bold text-stone-300 whitespace-nowrap">統計</button>  
                        </div>  
                          
                        <!-- 支出表單 -->  
                        <div id="form-expense" class="space-y-4 mb-6">  
                            <div class="flex flex-col">  
                                <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">支出項目</label>  
                                <input type="text" id="exp-name" placeholder="例如：午餐" class="w-full p-3 input-style text-sm">  
                            </div>  
                            <div class="grid grid-cols-2 gap-2">  
                                <div class="flex flex-col">  
                                    <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">儲蓄罐</label>  
                                    <select id="exp-category" class="w-full p-3 input-style text-[11px]"></select>  
                                </div>  
                                <div class="flex flex-col">  
                                    <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">日期</label>  
                                    <input type="date" id="exp-date" class="p-3 input-style text-[11px]">  
                                </div>  
                            </div>  
                            <div class="grid grid-cols-2 gap-2">  
                                <div class="flex flex-col">  
                                    <div class="flex justify-between items-center mb-1 ml-1">  
                                        <label class="text-[9px] text-stone-400 font-bold">支付方式</label>  
                                        <button onclick="openPaymentModal()" class="text-[9px] text-stone-400 hover:text-[#b8a390] transition">+ 新增</button>  
                                    </div>  
                                    <select id="exp-payment" class="p-3 input-style text-[11px]"></select>  
                                </div>  
                                <div class="flex flex-col">  
                                    <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">帳戶</label>  
                                    <select id="exp-account" class="p-3 input-style text-[11px]"></select>  
                                </div>  
                            </div>  
                            <input type="number" id="exp-amount" placeholder="金額" class="w-full p-3 input-style text-sm font-bold">  
                            <button onclick="addRecord('expense')" class="w-full milktea-gradient text-white py-3 rounded-xl font-bold">新增支出</button>  
                            <div class="flex-grow overflow-y-auto max-h-[250px] space-y-2 pr-1 mt-4" id="record-list-expense"></div>  
                        </div>  

                        <!-- 收入表單 -->  
                        <div id="form-income" class="space-y-4 mb-6 hidden">  
                            <div class="flex flex-col">  
                                <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">收入來源</label>  
                                <input type="text" id="inc-name" placeholder="來源名稱" class="w-full p-3 input-style text-sm">  
                            </div>  
                            <div class="grid grid-cols-2 gap-2">  
                                <input type="date" id="inc-date" class="p-3 input-style text-[11px]">  
                                <select id="inc-account" class="p-3 input-style text-[11px]"></select>  
                            </div>  
                            <input type="number" id="inc-amount" placeholder="金額" class="w-full p-3 input-style text-sm font-bold">  
                            <button onclick="addRecord('income')" class="w-full milktea-gradient-green text-white py-3 rounded-xl font-bold">新增收入</button>  
                            <div class="flex-grow overflow-y-auto max-h-[250px] space-y-2 pr-1 mt-4" id="record-list-income"></div>  
                        </div>  

                        <!-- 多支出表單 -->  
                        <div id="form-extra" class="space-y-4 mb-6 hidden">  
                            <div class="flex flex-col">  
                                <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">多支出項目</label>  
                                <input type="text" id="extra-name" placeholder="例如：專案採買" class="w-full p-3 input-style text-sm">  
                            </div>  
                            <div class="grid grid-cols-2 gap-2">  
                                <select id="extra-category" class="w-full p-3 input-style text-[11px]"></select>  
                                <input type="date" id="extra-date" class="p-3 input-style text-[11px]">  
                            </div>  
                            <div class="grid grid-cols-2 gap-2">  
                                <select id="extra-payment" class="p-3 input-style text-[11px]"></select>  
                                <select id="extra-account" class="p-3 input-style text-[11px]"></select>  
                            </div>  
                            <input type="number" id="extra-amount" placeholder="金額" class="w-full p-3 input-style text-sm font-bold">  
                            <button onclick="addRecord('extra')" class="w-full bg-indigo-400 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition">新增多支出</button>  
                            <div class="flex-grow overflow-y-auto max-h-[250px] space-y-2 pr-1 mt-4" id="record-list-extra"></div>  
                        </div>  

                        <!-- 調整表單 -->  
                        <div id="form-adjustment" class="space-y-4 mb-6 hidden">  
                            <div class="flex flex-col">  
                                <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">調整項目</label>  
                                <input type="text" id="adj-name" placeholder="例如：繳卡費" class="w-full p-3 input-style text-sm">  
                            </div>  
                            <div class="grid grid-cols-2 gap-2">  
                                <select id="adj-type" class="w-full p-3 input-style text-[11px]" onchange="toggleTransferAccount()">  
                                    <option value="minus">減少 (扣款)</option>  
                                    <option value="plus">增加 (存入)</option>  
                                    <option value="transfer">轉帳 (互轉)</option>  
                                </select>  
                                <input type="date" id="adj-date" class="p-3 input-style text-[11px]">  
                            </div>  
                            <div class="grid grid-cols-2 gap-2">  
                                <select id="adj-account" class="w-full p-3 input-style text-[11px]"></select>  
                                <select id="adj-target-account" class="w-full p-3 input-style text-[11px] hidden border-blue-200"></select>  
                            </div>  
                            <input type="number" id="adj-amount" placeholder="金額" class="w-full p-3 input-style text-sm font-bold">  
                            <button onclick="addAdjustmentRecord()" class="w-full bg-stone-500 text-white py-3 rounded-xl font-bold">新增調整</button>  
                            <div class="flex-grow overflow-y-auto max-h-[250px] space-y-2 pr-1 mt-4" id="record-list-adjustment"></div>  
                        </div>  

                        <div id="form-stats" class="space-y-4 hidden h-full overflow-y-auto pr-1">  
                            <div id="stats-render-target" class="space-y-4"></div>  
                        </div>  
                    </div>  
                </div>  
            </div>  
        </div>  

        <!-- ================= 旅行帳本模式介面 ================= -->  
        <div id="travel-view" class="space-y-8 hidden">  
            <!-- 匯率管理卡片 -->  
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-100">  
                <div class="flex justify-between items-center mb-4">  
                    <h3 class="text-xs font-bold text-stone-400 tracking-widest uppercase">✈️ 旅行外幣匯率設定 (對台幣 TWD)</h3>  
                    <button onclick="fetchTravelRates()" class="text-[10px] milktea-gradient text-white px-3 py-1.5 rounded-lg font-bold shadow-sm">自動抓取最新匯率</button>  
                </div>  
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3" id="travel-rates-container">  
                    <!-- 動態渲染匯率輸入框 -->  
                </div>  
            </div>  

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">  
                <div class="lg:col-span-8">  
                    <div class="milktea-gradient-brown text-[#5d5245] rounded-3xl p-8 shadow-md text-center mb-6">  
                        <h2 class="text-xs font-bold opacity-80 mb-2 uppercase tracking-widest">本次旅行總支出 (折合台幣)</h2>  
                        <div class="text-6xl font-black tracking-tighter" id="travel-total-twd">$0</div>  
                    </div>  
                    <div class="bg-white rounded-2xl p-6 border border-stone-100 shadow-sm">  
                        <h3 class="text-xs font-bold text-stone-400 mb-4 tracking-widest uppercase">本趟旅行明細列表</h3>  
                        <div id="trip-records-list" class="space-y-3"></div>  
                    </div>  
                </div>  

                <div class="lg:col-span-4">  
                    <div class="bg-white rounded-2xl p-6 border border-stone-100 shadow-sm space-y-4">  
                        <h3 class="text-xs font-bold text-stone-400 tracking-widest uppercase">新增旅行支出</h3>  
                        <div class="flex flex-col">  
                            <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">項目名稱</label>  
                            <input type="text" id="trip-item-name" placeholder="例如：機票、飯店、晚餐" class="w-full p-3 input-style text-sm">  
                        </div>  
                        <div class="grid grid-cols-2 gap-2">  
                            <div class="flex flex-col">  
                                <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">旅行類別</label>  
                                <select id="trip-item-category" class="w-full p-3 input-style text-[11px]">  
                                    <option value="飲食">飲食</option>  
                                    <option value="交通">交通</option>  
                                    <option value="住宿">住宿</option>  
                                    <option value="購物">購物</option>  
                                    <option value="機票">機票</option>  
                                    <option value="其他">其他</option>  
                                </select>  
                            </div>  
                            <div class="flex flex-col">  
                                <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">日期</label>  
                                <input type="date" id="trip-date" class="p-3 input-style text-[11px]">  
                            </div>  
                        </div>  
                        <div class="grid grid-cols-2 gap-2">  
                            <div class="flex flex-col">  
                                <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">幣別</label>  
                                <select id="trip-currency" class="w-full p-3 input-style text-[11px]">  
                                    <option value="TWD">TWD</option>  
                                    <option value="JPY">JPY</option>  
                                    <option value="USD">USD</option>  
                                    <option value="KRW">KRW</option>  
                                    <option value="EUR">EUR</option>  
                                    <option value="HKD">HKD</option>  
                                    <option value="THB">THB</option>  
                                </select>  
                            </div>  
                            <div class="flex flex-col">  
                                <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">支付帳戶</label>  
                                <select id="trip-item-account" class="w-full p-3 input-style text-[11px]"></select>  
                            </div>  
                        </div>  
                        <div class="flex flex-col">  
                            <label class="text-[9px] text-stone-400 mb-1 ml-1 font-bold">外幣金額</label>  
                            <input type="number" id="trip-item-amount" placeholder="金額" class="w-full p-3 input-style text-sm font-bold">  
                        </div>  
                        <button onclick="addTripRecord()" class="w-full milktea-gradient-brown text-[#5d5245] py-3 rounded-xl font-bold shadow-sm hover:brightness-105 transition">新增旅行紀錄</button>  
                    </div>  
                </div>  
            </div>  
        </div>  
    </div>  

    <!-- Modals -->  
    <div id="ledger-modal" class="fixed inset-0 modal-bg flex items-center justify-center p-4 z-50 hidden">  
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl space-y-4">  
            <h3 class="text-lg font-bold text-stone-700">新增帳本</h3>  
            <input type="text" id="new-ledger-name" placeholder="帳本名稱 (例如：2026東京自由行)" class="w-full p-3 input-style">  
            <div class="flex gap-2">  
                <button onclick="toggleModal('ledger-modal')" class="flex-1 py-3 text-stone-400">取消</button>  
                <button onclick="createLedger()" class="flex-1 milktea-gradient text-white py-3 rounded-xl font-bold">建立</button>  
            </div>  
        </div>  
    </div>  

    <div id="account-modal" class="fixed inset-0 modal-bg flex items-center justify-center p-4 z-50 hidden">  
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl space-y-4">  
            <h3 class="text-lg font-bold text-stone-700">帳戶管理</h3>  
            <input type="text" id="new-acc-name" placeholder="帳戶名稱" class="w-full p-3 input-style">  
            <div class="grid grid-cols-2 gap-2">  
                <input type="number" id="new-acc-balance" placeholder="初始餘額" class="w-full p-3 input-style">  
                <select id="new-acc-currency" class="p-3 input-style"><option value="TWD">TWD</option><option value="USD">USD</option></select>  
            </div>  
            <div class="flex items-center gap-2 px-1">  
                <input type="checkbox" id="new-acc-exclude" class="rounded text-[#b8a390]">  
                <label for="new-acc-exclude" class="text-[10px] text-stone-500 font-bold">不計入總資產</label>  
            </div>  
            <div class="flex gap-2">  
                <button onclick="toggleModal('account-modal')" class="flex-1 py-3 text-stone-400">取消</button>  
                <button onclick="addAccountCloud()" class="flex-1 milktea-gradient text-white py-3 rounded-xl font-bold">保存</button>  
            </div>  
            <div id="modal-account-list" class="mt-4 space-y-2 max-h-40 overflow-y-auto border-t pt-4"></div>  
        </div>  
    </div>  

    <div id="fixed-expense-modal" class="fixed inset-0 modal-bg flex items-center justify-center p-4 z-50 hidden">  
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl space-y-4">  
            <h3 class="text-lg font-bold text-stone-700">新增固定支出</h3>  
            <input type="text" id="fixed-exp-name" placeholder="項目名稱 (例如：房租)" class="w-full p-3 input-style">  
            <div class="grid grid-cols-2 gap-2">  
                <input type="number" id="fixed-exp-amount" placeholder="金額" class="w-full p-3 input-style">  
                <select id="fixed-exp-account" class="p-3 input-style"></select>  
            </div>  
            <div class="flex gap-2">  
                <button onclick="toggleModal('fixed-expense-modal')" class="flex-1 py-3 text-stone-400">取消</button>  
                <button onclick="addFixedExpense()" class="flex-1 milktea-gradient text-white py-3 rounded-xl font-bold">新增</button>  
            </div>  
        </div>  
    </div>  

    <div id="payment-method-modal" class="fixed inset-0 modal-bg flex items-center justify-center p-4 z-50 hidden">  
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl space-y-4">  
            <h3 class="text-lg font-bold text-stone-700">新增支付方式</h3>  
            <input type="text" id="new-payment-name" placeholder="例如：全支付" class="w-full p-3 input-style">  
            <div class="flex gap-2">  
                <button onclick="toggleModal('payment-method-modal')" class="flex-1 py-3 text-stone-400">取消</button>  
                <button onclick="confirmAddPaymentMethod()" class="flex-1 milktea-gradient text-white py-3 rounded-xl font-bold">新增</button>  
            </div>  
        </div>  
    </div>  

    <div id="month-picker-modal" class="fixed inset-0 modal-bg flex items-center justify-center p-4 z-50 hidden">  
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">  
            <h3 class="text-lg font-bold text-stone-700">選擇月份</h3>  
            <div class="flex justify-between items-center px-4">  
                <button onclick="changePickerYear(-1)" class="p-2 text-stone-400">&lt;</button>  
                <span id="picker-year-display" class="font-black text-stone-600 text-xl">2026</span>  
                <button onclick="changePickerYear(1)" class="p-2 text-stone-400">&gt;</button>  
            </div>  
            <div class="grid grid-cols-4 gap-3" id="picker-month-grid"></div>  
            <button onclick="toggleModal('month-picker-modal')" class="w-full py-3 text-stone-400">關閉</button>  
        </div>  
    </div>  

    <script>  
        const STORAGE_KEY = 'MULTI_LEDGER_MASTER_V3';  
        let tempPickerYear = new Date().getFullYear();  
        let tempPickerMonth = new Date().getMonth() + 1;  

        window.state = {  
            activeLedgerId: "default",  
            ledgers: {  
                "default": {  
                    name: "預設主帳本",  
                    records: [],  
                    tripRecords: [],  
                    accounts: [{ name: "現金", balance: 0, currency: "TWD" }],  
                    settings: { salary: 45000, savingsGoal: 10000, usdRate: 32.5, paymentMethods: ['現金', 'CUBE', 'LinePay', '銀行轉帳'], jars: { NEC: 60, FFA: 15, INT: 15, PLAY: 10 } },  
                    fixedExpenses: [],  
                    travelRates: { JPY: 0.21, USD: 32.5, KRW: 0.024, EUR: 35.0, HKD: 4.1, THB: 0.95 }  
                }  
            },  
            scriptUrl: ''  
        };  

        window.onload = function() {  
            const todayIso = new Date().toISOString();  
            const today = todayIso.split('T')[0];  
            const currentMonth = todayIso.substring(0, 7);   
              
            ['exp-date', 'inc-date', 'trip-date', 'adj-date', 'extra-date'].forEach(id => {  
                const el = document.getElementById(id);  
                if(el) el.value = today;  
            });  
              
            const viewMonthEl = document.getElementById('view-month');  
            if(viewMonthEl) {  
                viewMonthEl.value = currentMonth;  
                document.getElementById('view-month-display').innerText = `${currentMonth.split('-')[0]} 年 ${currentMonth.split('-')[1]} 月`;  
            }  

            loadLocalData();  
            syncWithSheets(false);  
        };  

        function getActiveLedger() {  
            if (!window.state.ledgers[window.state.activeLedgerId]) {  
                window.state.activeLedgerId = Object.keys(window.state.ledgers)[0] || "default";  
            }  
            return window.state.ledgers[window.state.activeLedgerId];  
        }  

        function loadLocalData() {  
            const saved = localStorage.getItem(STORAGE_KEY);  
            if (saved) {  
                const parsed = JSON.parse(saved);  
                window.state = { ...window.state, ...parsed };  
                if (document.getElementById('script-url')) document.getElementById('script-url').value = window.state.scriptUrl || '';  
            }  
            updateUI();  
        }  

        function saveData() {  
            const urlInput = document.getElementById('script-url');  
            if (urlInput) window.state.scriptUrl = urlInput.value.trim();  
            localStorage.setItem(STORAGE_KEY, JSON.stringify(window.state));  
            updateUI();  
        }  

        async function pushAction(actionName, dataObj) {  
            if (!window.state.scriptUrl) return;  
            try {  
                await fetch(window.state.scriptUrl, {   
                    method: 'POST',   
                    mode: 'no-cors',   
                    body: JSON.stringify({ action: actionName, ledgerId: window.state.activeLedgerId, data: dataObj })   
                });  
            } catch (e) { console.error(e); }  
        }  

        async function syncWithSheets(showNotify) {  
            if (!window.state.scriptUrl) return;  
            const statusEl = document.getElementById('sync-status');  
            if (statusEl) statusEl.classList.remove('hidden');  
            try {  
                const res = await fetch(window.state.scriptUrl);  
                const cloud = await res.json();  
                if (cloud && cloud.ledgers) {  
                    window.state.ledgers = cloud.ledgers;  
                    if (cloud.activeLedgerId) window.state.activeLedgerId = cloud.activeLedgerId;  
                    saveData();  
                    if (showNotify) alert("雲端同步成功！");  
                }  
            } catch (e) {   
                if (showNotify) alert("同步失敗，請檢查網址。");   
            } finally {   
                if (statusEl) statusEl.classList.add('hidden');   
            }  
        }  

        function switchLedger(ledgerId) {  
            window.state.activeLedgerId = ledgerId;  
            saveData();  
        }  

        async function createLedger() {  
            const nameEl = document.getElementById('new-ledger-name');  
            const name = nameEl.value.trim();  
            if (!name) return;  

            const newId = 'ledger_' + Date.now();  
            window.state.ledgers[newId] = {  
                name: name,  
                records: [],  
                tripRecords: [],  
                accounts: [{ name: "現金", balance: 0, currency: "TWD" }],  
                settings: { salary: 45000, savingsGoal: 10000, usdRate: 32.5, paymentMethods: ['現金', 'CUBE', 'LinePay', '銀行轉帳'], jars: { NEC: 60, FFA: 15, INT: 15, PLAY: 10 } },  
                fixedExpenses: [],  
                travelRates: { JPY: 0.21, USD: 32.5, KRW: 0.024, EUR: 35.0, HKD: 4.1, THB: 0.95 }  
            };  
            window.state.activeLedgerId = newId;  
            nameEl.value = '';  
            toggleModal('ledger-modal');  
            saveData();  
            await pushAction('updateLedgersList', { ledgers: window.state.ledgers, activeLedgerId: window.state.activeLedgerId });  
        }  

        let currentAppMode = 'finance'; // 'finance' 或 'travel'  
        function switchAppMode() {  
            currentAppMode = currentAppMode === 'finance' ? 'travel' : 'finance';  
            const finView = document.getElementById('finance-view');  
            const travView = document.getElementById('travel-view');  
            const btn = document.getElementById('mode-switch-btn');  

            if (currentAppMode === 'travel') {  
                finView.classList.add('hidden');  
                travView.classList.remove('hidden');  
                btn.innerText = "切換至：💰 財經主帳本模式";  
            } else {  
                travView.classList.add('hidden');  
                finView.classList.remove('hidden');  
                btn.innerText = "切換至：✈️ 旅行帳本模式";  
            }  
            updateUI();  
        }  

        function toggleModal(id) {  
            const m = document.getElementById(id);  
            if (m) m.classList.toggle('hidden');  
            if (id === 'account-modal') renderAccountList();  
            if (id === 'fixed-expense-modal') {  
                const ledger = getActiveLedger();  
                document.getElementById('fixed-exp-account').innerHTML = ledger.accounts.map(a => `<option value="${a.name}">${a.name}</option>`).join('');  
            }  
        }  

        async function fetchTravelRates() {  
            try {  
                const res = await fetch('https://open.er-api.com/v6/latest/TWD');  
                const data = await res.json();  
                if (data && data.rates) {  
                    const ledger = getActiveLedger();  
                    if (!ledger.travelRates) ledger.travelRates = {};  
                    ['JPY', 'USD', 'KRW', 'EUR', 'HKD', 'THB'].forEach(curr => {  
                        if (data.rates[curr]) {  
                            ledger.travelRates[curr] = parseFloat((1 / data.rates[curr]).toFixed(4));  
                        }  
                    });  
                    saveData();  
                    await pushAction('updateTravelRates', ledger.travelRates);  
                    alert("匯率更新成功！");  
                }  
            } catch (e) { alert("自動抓取匯率失敗"); }  
        }  

        async function addRecord(type) {  
            const ledger = getActiveLedger();  
            let p = 'exp';  
            if (type === 'income') p = 'inc';  
            else if (type === 'extra') p = 'extra';  

            const name = document.getElementById(`${p}-name`).value.trim();  
            const amount = parseFloat(document.getElementById(`${p}-amount`).value) || 0;  
            const date = document.getElementById(`${p}-date`).value;  
            const accountName = document.getElementById(`${p}-account`).value;  

            if (amount <= 0 || !accountName) return;  

            const record = {  
                id: Date.now(), type, name: name || '未命名', amount, date, accountName,  
                category: (type === 'expense' || type === 'extra') ? document.getElementById(`${p}-category`).value : 'INC',  
                paymentMethod: (type === 'expense' || type === 'extra') ? document.getElementById(`${p}-payment`).value : null  
            };  

            ledger.records.unshift(record);  
            saveData();  
            await pushAction('addRecord', record);  
            document.getElementById(`${p}-name`).value = '';  
            document.getElementById(`${p}-amount`).value = '';  
        }  

        async function addTripRecord() {  
            const ledger = getActiveLedger();  
            const name = document.getElementById('trip-item-name').value.trim();  
            const amount = parseFloat(document.getElementById('trip-item-amount').value) || 0;  
            const category = document.getElementById('trip-item-category').value;  
            const accountName = document.getElementById('trip-item-account').value;  
            const date = document.getElementById('trip-date').value;  
            const currency = document.getElementById('trip-currency').value;  

            if (!name || amount <= 0 || !accountName) return;  

            const item = { id: Date.now(), type: 'trip', tripName: name, category, amount, accountName, date, currency };  
            ledger.tripRecords.unshift(item);  
            saveData();  
            await pushAction('addTripRecord', item);  
            document.getElementById('trip-item-name').value = '';  
            document.getElementById('trip-item-amount').value = '';  
        }  

        async function addAdjustmentRecord() {  
            const ledger = getActiveLedger();  
            const name = document.getElementById('adj-name').value.trim();  
            const amount = parseFloat(document.getElementById('adj-amount').value) || 0;  
            const accountName = document.getElementById('adj-account').value;  
            const targetAccountName = document.getElementById('adj-target-account').value;  
            const date = document.getElementById('adj-date').value;  
            const adjType = document.getElementById('adj-type').value;  

            if (!name || amount <= 0 || !accountName) return;  

            const record = { id: Date.now(), type: 'adjustment', adjType, name, amount, date, accountName, targetAccountName: adjType === 'transfer' ? targetAccountName : null };  
            ledger.records.unshift(record);  
            saveData();  
            await pushAction('addRecord', record);  
            document.getElementById('adj-name').value = '';  
            document.getElementById('adj-amount').value = '';  
        }  

        async function deleteRecord(id, type = 'normal') {  
            const ledger = getActiveLedger();  
            if (type === 'trip') ledger.tripRecords = ledger.tripRecords.filter(t => t.id != id);  
            else ledger.records = ledger.records.filter(r => r.id != id);  
            saveData();  
            await pushAction('deleteRecord', { id, type });  
        }  

        async function addAccountCloud() {  
            const ledger = getActiveLedger();  
            const name = document.getElementById('new-acc-name').value.trim();  
            const balance = parseFloat(document.getElementById('new-acc-balance').value) || 0;  
            const currency = document.getElementById('new-acc-currency').value;  
            const excludeFromTotal = document.getElementById('new-acc-exclude').checked;  

            if (!name) return;  
            const idx = ledger.accounts.findIndex(a => a.name === name);  
            if (idx > -1) ledger.accounts[idx] = { name, balance, currency, excludeFromTotal };  
            else ledger.accounts.push({ name, balance, currency, excludeFromTotal });  

            toggleModal('account-modal');  
            saveData();  
            await pushAction('updateAccounts', ledger.accounts);  
        }  

        function renderAccountList() {  
            const ledger = getActiveLedger();  
            const listEl = document.getElementById('modal-account-list');  
            if (listEl) {  
                listEl.innerHTML = ledger.accounts.map(a => `  
                    <div class="flex justify-between items-center bg-stone-50 p-2 rounded-lg text-[10px]">  
                        <span class="font-bold text-stone-600">${a.name} (${a.currency})</span>  
                        <button onclick="deleteAccount('${a.name}')" class="text-stone-300 hover:text-red-400 font-bold">✕</button>  
                    </div>  
                `).join('');  
            }  
        }  

        async function deleteAccount(name) {  
            const ledger = getActiveLedger();  
            ledger.accounts = ledger.accounts.filter(a => a.name !== name);  
            renderAccountList();  
            saveData();  
            await pushAction('updateAccounts', ledger.accounts);  
        }  

        async function addFixedExpense() {  
            const ledger = getActiveLedger();  
            const name = document.getElementById('fixed-exp-name').value.trim();  
            const amount = parseFloat(document.getElementById('fixed-exp-amount').value) || 0;  
            const accountName = document.getElementById('fixed-exp-account').value;  

            if (!name || amount <= 0) return;  
            ledger.fixedExpenses.push({ id: Date.now(), name, amount, accountName });  
            toggleModal('fixed-expense-modal');  
            saveData();  
            await pushAction('updateFixedExpenses', ledger.fixedExpenses);  
        }  

        async function deleteFixedExpense(id) {  
            const ledger = getActiveLedger();  
            ledger.fixedExpenses = ledger.fixedExpenses.filter(f => f.id !== id);  
            saveData();  
            await pushAction('updateFixedExpenses', ledger.fixedExpenses);  
        }  

        function updateGlobalSettings() {  
            const ledger = getActiveLedger();  
            ledger.settings.salary = parseFloat(document.getElementById('salary').value) || 0;  
            ledger.settings.savingsGoal = parseFloat(document.getElementById('savings-goal').value) || 0;  
            ledger.settings.jars.NEC = parseFloat(document.getElementById('jar-pct-nec').value) || 0;  
            ledger.settings.jars.FFA = parseFloat(document.getElementById('jar-pct-ffa').value) || 0;  
            ledger.settings.jars.INT = parseFloat(document.getElementById('jar-pct-int').value) || 0;  
            ledger.settings.jars.PLAY = parseFloat(document.getElementById('jar-pct-play').value) || 0;  
            saveData();  
            pushAction('updateSettings', ledger.settings);  
        }  

        function updateUI() {  
            const ledger = getActiveLedger();  

            // 渲染頂部帳本切換按鈕  
            const tabsEl = document.getElementById('ledger-tabs-container');  
            if (tabsEl) {  
                tabsEl.innerHTML = Object.keys(window.state.ledgers).map(id => {  
                    const l = window.state.ledgers[id];  
                    const isActive = id === window.state.activeLedgerId;  
                    return `<button onclick="switchLedger('${id}')" class="px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${isActive ? 'milktea-gradient text-white shadow-sm' : 'bg-stone-50 text-stone-500 hover:bg-stone-100'}">${l.name}</button>`;  
                }).join('');  
            }  

            document.getElementById('current-ledger-title').innerText = ledger.name;  
            document.getElementById('salary').value = ledger.settings.salary || 45000;  
            document.getElementById('savings-goal').value = ledger.settings.savingsGoal || 10000;  
            document.getElementById('usd-rate').value = ledger.settings.usdRate || 32.5;  

            const jars = ledger.settings.jars || { NEC: 60, FFA: 15, INT: 15, PLAY: 10 };  
            document.getElementById('jar-pct-nec').value = jars.NEC;  
            document.getElementById('jar-pct-ffa').value = jars.FFA;  
            document.getElementById('jar-pct-int').value = jars.INT;  
            document.getElementById('jar-pct-play').value = jars.PLAY;  

            const rate = ledger.settings.usdRate || 32.5;  
            const curMap = {};  
            ledger.accounts.forEach(a => { curMap[a.name] = a.currency; });  
            const balances = {};  
            ledger.accounts.forEach(a => { balances[a.name] = a.balance; });  

            const viewMonth = document.getElementById('view-month').value || new Date().toISOString().substring(0, 7);  

            let totalIncomeTWD = 0, totalExpenseTWD = 0, totalExtraTWD = 0;  
            let jarSpendTWD = { NEC:0, FFA:0, LTSS:0, INT:0, PLAY:0 };  

            ledger.records.forEach(r => {  
                const twd = curMap[r.accountName] === 'USD' ? r.amount * rate : r.amount;  
                if (r.type === 'income' && balances.hasOwnProperty(r.accountName)) balances[r.accountName] += r.amount;  
                else if ((r.type === 'expense' || r.type === 'extra') && balances.hasOwnProperty(r.accountName)) balances[r.accountName] -= r.amount;  
                else if (r.type === 'adjustment') {  
                    if (r.adjType === 'plus') balances[r.accountName] += r.amount;  
                    else if (r.adjType === 'minus') balances[r.accountName] -= r.amount;  
                    else if (r.adjType === 'transfer') {  
                        balances[r.accountName] -= r.amount;  
                        if (r.targetAccountName && balances.hasOwnProperty(r.targetAccountName)) balances[r.targetAccountName] += r.amount;  
                    }  
                }  

                if (r.date.startsWith(viewMonth)) {  
                    if (r.type === 'income') totalIncomeTWD += twd;  
                    else if (r.type === 'expense') { totalExpenseTWD += twd; if(jarSpendTWD[r.category]) jarSpendTWD[r.category] += twd; }  
                    else if (r.type === 'extra') { totalExtraTWD += twd; if(jarSpendTWD[r.category]) jarSpendTWD[r.category] += twd; }  
                }  
            });  

            ledger.fixedExpenses.forEach(f => {  
                const twd = curMap[f.accountName] === 'USD' ? f.amount * rate : f.amount;  
                if (balances.hasOwnProperty(f.accountName)) balances[f.accountName] -= f.amount;  
                totalExpenseTWD += twd;  
                jarSpendTWD.NEC += twd;  
            });  

            // 渲染帳戶總結  
            let totalAssetsTWD = 0;  
            document.getElementById('accounts-container').innerHTML = ledger.accounts.map(acc => {  
                const amt = balances[acc.name] || 0;  
                const twd = acc.currency === 'USD' ? amt * rate : amt;  
                if (!acc.excludeFromTotal) totalAssetsTWD += twd;  
                return `<div class="bg-stone-50 p-4 rounded-xl border border-stone-100"><div class="text-[9px] text-stone-400 font-bold mb-1">${acc.name}</div><div class="font-bold text-stone-600">${acc.currency === 'USD' ? '$' : ''}${Math.round(amt).toLocaleString()}</div></div>`;  
            }).join('');  
            document.getElementById('total-assets').innerText = `$${Math.round(totalAssetsTWD).toLocaleString()}`;  

            // 渲染下拉選單  
            const accOpts = ledger.accounts.map(a => `<option value="${a.name}">${a.name} (${a.currency})</option>`).join('');  
            ['exp-account', 'inc-account', 'trip-item-account', 'fixed-exp-account', 'adj-account', 'extra-account', 'adj-target-account'].forEach(id => {  
                const el = document.getElementById(id);  
                if(el) el.innerHTML = accOpts;  
            });  

            const paymentMethods = ledger.settings.paymentMethods || ['現金', 'CUBE', 'LinePay', '銀行轉帳'];  
            const payOpts = paymentMethods.map(p => `<option value="${p}">${p}</option>`).join('');  
            ['exp-payment', 'extra-payment'].forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML = payOpts; });  

            // 渲染紀錄清單  
            const filteredRecs = ledger.records.filter(r => r.date.startsWith(viewMonth));  
            const renderRec = (r) => `  
                <div class="flex justify-between items-center p-3 bg-stone-50 rounded-xl border border-stone-100">  
                    <div class="flex flex-col">  
                        <span class="text-xs font-bold text-stone-600">${r.name}</span>  
                        <span class="text-[8px] text-stone-300">${r.date} · ${r.accountName}</span>  
                    </div>  
                    <div class="flex items-center gap-2">  
                        <span class="text-xs font-bold ${r.type === 'income' ? 'text-green-600' : 'text-stone-500'}">${r.type === 'income' ? '+' : '-'}$${r.amount.toLocaleString()}</span>  
                        <button onclick="deleteRecord(${r.id})" class="text-stone-300 hover:text-red-400 text-xs">✕</button>  
                    </div>  
                </div>  
            `;  
            document.getElementById('record-list-expense').innerHTML = filteredRecs.filter(r => r.type === 'expense').map(renderRec).join('');  
            document.getElementById('record-list-income').innerHTML = filteredRecs.filter(r => r.type === 'income').map(renderRec).join('');  
            document.getElementById('record-list-extra').innerHTML = filteredRecs.filter(r => r.type === 'extra').map(renderRec).join('');  
            document.getElementById('record-list-adjustment').innerHTML = filteredRecs.filter(r => r.type === 'adjustment').map(r => `  
                <div class="flex justify-between items-center p-3 bg-stone-50 rounded-xl border border-stone-100">  
                    <span class="text-xs font-bold text-stone-600">${r.name} (${r.adjType})</span>  
                    <button onclick="deleteRecord(${r.id})" class="text-stone-300 hover:text-red-400 text-xs">✕</button>  
                </div>  
            `).join('');  

            // 渲染旅行模式數據  
            if (!ledger.travelRates) ledger.travelRates = { JPY: 0.21, USD: 32.5, KRW: 0.024, EUR: 35.0, HKD: 4.1, THB: 0.95 };  
            document.getElementById('travel-rates-container').innerHTML = Object.keys(ledger.travelRates).map(curr => `  
                <div class="flex flex-col"><label class="text-[9px] text-stone-400 mb-1">${curr} 匯率</label><input type="number" step="0.001" value="${ledger.travelRates[curr]}" onchange="updateTravelRate('${curr}', this.value)" class="p-2 input-style text-xs font-bold"></div>  
            `).join('');  

            let totalTripTWD = 0;  
            document.getElementById('trip-records-list').innerHTML = ledger.tripRecords.map(t => {  
                const rateVal = ledger.travelRates[t.currency] || 1;  
                const twdEquiv = t.currency === 'TWD' ? t.amount : t.amount * rateVal;  
                totalTripTWD += twdEquiv;  
                return `  
                    <div class="flex justify-between items-center p-3 bg-stone-50 rounded-xl border border-stone-100">  
                        <div><span class="text-xs font-bold">${t.tripName} (${t.category})</span><span class="text-[9px] text-stone-400 ml-2">${t.currency} ${t.amount} (約 NT$${Math.round(twdEquiv)})</span></div>  
                        <button onclick="deleteRecord(${t.id}, 'trip')" class="text-stone-300 hover:text-red-400">✕</button>  
                    </div>  
                `;  
            }).join('');  
            document.getElementById('travel-total-twd').innerText = `$${Math.round(totalTripTWD).toLocaleString()}`;  
        }  

        function updateTravelRate(curr, val) {  
            const ledger = getActiveLedger();  
            ledger.travelRates[curr] = parseFloat(val) || 1;  
            saveData();  
            pushAction('updateTravelRates', ledger.travelRates);  
            updateUI();  
        }  

        function switchTab(tab) {  
            ['expense', 'income', 'extra', 'adjustment', 'stats'].forEach(t => {  
                document.getElementById(`form-${t}`).classList.toggle('hidden', t !== tab);  
                const btn = document.getElementById(`tab-${t}`);  
                if (btn) {  
                    if (t === tab) btn.className = "tab-btn flex-1 py-2 text-[11px] font-bold border-b-2 border-[#b8a390] text-stone-600";  
                    else btn.className = "tab-btn flex-1 py-2 text-[11px] font-bold text-stone-300";  
                }  
            });  
        }  

        function toggleTransferAccount() {  
            const type = document.getElementById('adj-type').value;  
            document.getElementById('adj-target-account').classList.toggle('hidden', type !== 'transfer');  
        }  

        function openMonthPickerModal() { toggleModal('month-picker-modal'); }  
        function openPaymentModal() { toggleModal('payment-method-modal'); }  
        function confirmAddPaymentMethod() {  
            const name = document.getElementById('new-payment-name').value.trim();  
            if (!name) return;  
            const ledger = getActiveLedger();  
            ledger.settings.paymentMethods.push(name);  
            toggleModal('payment-method-modal');  
            saveData();  
            pushAction('updateSettings', ledger.settings);  
            updateUI();  
        }  
    </script>  
</body>  
</html>
